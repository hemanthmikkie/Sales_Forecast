version: "3.8"

services:
  # ── MySQL Database Service (matches local dev config) ──────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: sales_forecast_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-minnie}
      MYSQL_DATABASE: ${DB_NAME:-sales_forecast}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-minnie}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_PASSWORD:-minnie}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Web Application & ML Engine ────────────────────────────────────
  api_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales_forecast_api
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-minnie}
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sales_forecast}
      DATABASE_URL: mysql+pymysql://${DB_USER:-root}:${DB_PASSWORD:-minnie}@mysql_db:3306/${DB_NAME:-sales_forecast}
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "false"
      DEFAULT_LEAD_TIME_DAYS: 1
      DEFAULT_SAFETY_STOCK_RATIO: 0.20
      STOCKOUT_THRESHOLD_RATIO: 0.75
      OVERSTOCK_THRESHOLD_MULTIPLIER: 2.0
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports

volumes:
  mysql_data:
    driver: local
